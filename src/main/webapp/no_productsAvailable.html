<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Products Available - MyShoppingCart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
    margin: 0; padding: 0; box-sizing: border-box;
}
body, html {
    height: 100%;
    font-family: 'Poppins', sans-serif;
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2, #43cea2);
    color: #fff;
    text-align: center;
}
header {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}
header .logo {
    font-size: 28px;
    font-weight: 700;
}
header .nav-actions form button.logout {
    padding: 10px 24px;
    border-radius: 30px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: #fff;
    transition: 0.3s ease;
}
header .nav-actions form button.logout:hover {
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}
main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.25);
    max-width: 400px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.7s ease-in-out;
}
@keyframes fadeIn {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}
.card .icon {
    font-size: 70px;
    color: #facc15;
    margin-bottom: 20px;
}
.card h2 {
    font-size: 28px;
    margin-bottom: 15px;
    color: #fff;
    letter-spacing: 0.5px;
}
.card p {
    font-size: 16px;
    color: #f0f0f0;
    margin-bottom: 30px;
    line-height: 1.5;
}
.card form button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,154,158,0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card form button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(255,154,158,0.7);
}
footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    color: black;
    text-align: center;
    padding: 8px 0;
    font-size: 14px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<header>
    <div class="logo">MyShoppingCart</div>
    <div class="nav-actions">
        <form action="logout" method="get">
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>
</header>

<main>
    <div class="card">
        <div class="icon">
            <i class="fa-solid fa-box-open"></i>
        </div>
        <h3>No Products Available</h3>
        <p>We are sorry! Currently there are no products to display. Please check back later.</p>
        <form action="viewProducts" method="get">
            <button type="submit">Go Back</button>
        </form>
    </div>
</main>

<footer>
    &copy; 2025 MyShoppingCart. All rights reserved.
</footer>

</body>
</html>
