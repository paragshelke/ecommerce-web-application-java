<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome - MyShoppingCart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0; padding: 0; box-sizing: border-box;
}
body, html {
    height: 100%;
    font-family: 'Poppins', sans-serif;
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2, #43cea2);
    color: #fff;
    text-align: center;
}
header {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}
header .logo {
    font-size: 28px;
    font-weight: 700;
}
header .nav-actions form button.logout {
    padding: 10px 24px;
    border-radius: 30px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: #fff;
    transition: 0.3s ease;
}
header .nav-actions form button.logout:hover {
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}
.welcome-section {
    margin: 60px 20px 40px;
}
.welcome-section h1 {
    font-size: 3.5rem;
    font-weight: 800;
    text-shadow: 2px 2px 12px rgba(0,0,0,0.3);
    margin-bottom: 16px;
}
.welcome-section p {
    font-size: 1.5rem;
    font-weight: 500;
    color: #f0f0f0;
    text-shadow: 1px 1px 6px rgba(0,0,0,0.2);
}
main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 25px 45px rgba(0,0,0,0.25);
    max-width: 380px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,154,158,0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    text-decoration: none;
    text-align: center;
}
.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(255,154,158,0.7);
}
footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    color: black;
    text-align: center;
    padding: 8px 0;
    font-size: 14px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<header>
    <div class="logo">MyShoppingCart</div>
    <div class="nav-actions">
        <form action="logout" method="get">
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>
</header>

<div class="welcome-section">
    <h1>Welcome to MyShoppingCart !</h1>
    <p>Your trusted hub for effortless online shopping</p>
</div>

<main>
    <div class="card">
        <a href="admin_login.html" class="btn">Admin Login</a>
        <a href="customer_login.html" class="btn">Customer Login / Register</a>
    </div>
</main>

<footer>
    &copy; 2025 MyShoppingCart. All rights reserved.
</footer>

</body>
</html>
