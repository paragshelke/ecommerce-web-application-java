<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Updated | MyShoppingCart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0; padding: 0; box-sizing: border-box;
}
body, html {
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2, #43cea2);
    color: #fff;
    text-align: center;
}

/* Header */
header {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}
header .logo {
    font-size: 28px;
    font-weight: 700;
}
header .nav-actions form button.logout {
    padding: 10px 24px;
    border-radius: 30px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: #fff;
    transition: 0.3s ease;
}
header .nav-actions form button.logout:hover {
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

/* Main content */
main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.card {
    width: 420px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    padding: 40px 35px;
    border-radius: 26px;
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
    text-align: center;
    animation: fadeIn 0.8s ease-in-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px);}
    to { opacity: 1; transform: translateY(0);}
}
.card .success-icon {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #00c851, #007e33);
    color: #fff;
    font-size: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 10px 20px rgba(0, 200, 81, 0.5);
}
.card h1 {
    font-size: 28px;
    margin-bottom: 10px;
}
.card p {
    font-size: 16px;
    color: #f1f5f9;
    margin-bottom: 30px;
}
.card .btn-group {
    display: flex;
    gap: 16px;
    flex-direction: column;
}
.card .btn-group form button {
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
}
.card .dashboard-btn {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: #333;
    box-shadow: 0 10px 20px rgba(255, 154, 158, 0.5);
}
.card .dashboard-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(255, 154, 158, 0.7);
}
.card .logout-btn {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: #fff;
    box-shadow: 0 10px 20px rgba(255, 65, 108, 0.5);
}
.card .logout-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(255, 65, 108, 0.7);
}

/* Footer */
footer {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    color: black;
    text-align: center;
    padding: 8px 0;
    font-size: 14px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
}

@media (max-width: 480px) {
    .card { width: 90%; }
}
</style>
</head>
<body>

<header>
    <div class="logo">MyShoppingCart</div>
    <div class="nav-actions">
        <form action="logout" method="get">
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>
</header>

<main>
    <div class="card">
        <div class="success-icon">✓</div>
        <h1>Product Updated Successfully!</h1>
        <p>Your product has been updated in the system.<br>Inventory is now up to date.</p>
        <div class="btn-group">
            <form action="adminServlet" method="post">
                <button type="submit" class="dashboard-btn">Go to Admin Dashboard</button>
            </form>
          
        </div>
    </div>
</main>

<footer>
    &copy; 2025 MyShoppingCart. All rights reserved.
</footer>

</body>
</html>
