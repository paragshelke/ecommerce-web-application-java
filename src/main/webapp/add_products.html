<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - MyShoppingCart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg,#fde2e4,#e0c3fc,#c2e9fb);
    display: flex;
    flex-direction: column;
}

header {
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    color: #fff;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.25);
}

.nav-actions form button.logout {
    padding: 10px 24px;
    border-radius: 30px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: #fff;
    transition: 0.3s ease;
}

.nav-actions form button.logout:hover {
    transform: translateY(-2px) scale(1.08);
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    min-height: calc(100vh - 80px - 40px); /* adjust for header + footer height */
}

.form-card {
    width: 100%;
    max-width: 420px;
    padding: 28px;
    background: linear-gradient(135deg,#ffffff,#f0f4ff);
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    overflow-y: auto;
    max-height: 100%;
}

h3 {
    text-align: center;
    color: #2c3e50;
    font-size: 22px;
    margin-bottom: 24px;
}

.input-group {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #34495e;
    margin-bottom: 6px;
}

input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #cfd8dc;
    background: #f9f9ff;
    font-size: 14px;
    color: #2c3e50;
    outline: none;
}

textarea {
    resize: none;
    height: 80px;
}

input:focus, textarea:focus {
    border-color: #74b9ff;
    background: #ffffff;
}

.action-btn {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg,#ff6b6b,#feca57);
    transition: 0.3s;
}

.action-btn:hover {
    background: linear-gradient(135deg,#ff5252,#ffb347);
}

footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    color: black;
    text-align: center;
    padding: 8px 0;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    z-index: 1000;
}
</style>
</head>

<body>

<header>
    <div class="logo">MyShoppingCart</div>
    <div class="nav-actions">
        <form action="logout" method="get">
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>
</header>

<main>
    <div class="form-card">
        <h3>Add Product</h3>
        <form action="addProducts" method="post" enctype="multipart/form-data">
            <div class="input-group">
                <label>Product ID</label>
                <input type="number" name="productId" required>
            </div>
            <div class="input-group">
                <label>Product Name</label>
                <input type="text" name="productName">
            </div>
            <div class="input-group">
                <label>Product Price</label>
                <input type="number" step="0.01" name="productPrice">
            </div>
            <div class="input-group">
                <label>Product Image</label>
                <input type="file" name="productImage" accept="image/*" required>
            </div>
            <div class="input-group">
                <label>Product Description</label>
                <textarea name="productDescription"></textarea>
            </div>
            <button type="submit" class="action-btn">Save Product</button>
        </form>
    </div>
</main>

<footer>
    &copy; 2025 MyShoppingCart. All rights reserved.
</footer>

</body>
</html>
